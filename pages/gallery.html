    <!-- פילטר SVG לשם האתר: קו מתאר "חי" ורועד כמו דיו, וצל מודפס -->
    <svg class="svg-defs" aria-hidden="true">
        <filter id="ink-outline" x="-10%" y="-20%" width="125%" height="150%">
            <!-- רעש אקראי שגורם לקווים "לרעוד" -->
            <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="4" result="noise"/>
            <!-- קו המתאר: צורת האותיות מורחבת ב-3 פיקסלים -->
            <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="thick"/>
            <feDisplacementMap in="thick" in2="noise" scale="4" result="wobbly"/>
            <feFlood flood-color="#2b2b2b" result="ink"/>
            <feComposite in="ink" in2="wobbly" operator="in" result="outline"/>
            <!-- צל מודפס: אותו קו, מוזז הצידה -->
            <feOffset in="outline" dx="3" dy="3" result="shadow"/>
            <!-- המילוי הצבעוני רועד יחד עם הקו -->
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" result="fill"/>
            <feMerge>
                <feMergeNode in="shadow"/>
                <feMergeNode in="outline"/>
                <feMergeNode in="fill"/>
            </feMerge>
        </filter>
    </svg>
